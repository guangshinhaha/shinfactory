# Fallback for task keys with no role.
[routing.defaults]
provider = "claude"
model = "claude-sonnet-5-5"

# Model per role. Cheaper models by default; Opus only for planning and
# verification. Name a codex provider here only if you want work to leave claude.
# Set `sensitive = true` under [routing] to pin every stage to one provider.
[routing.roles]
scheduler = { provider = "claude", model = "claude-haiku-5-5" }
debrief   = { provider = "claude", model = "claude-haiku-5-5" }
builder   = { provider = "claude", model = "claude-sonnet-5-5" }
explorer  = { provider = "claude", model = "claude-sonnet-5-5" }
reviewer  = { provider = "claude", model = "claude-sonnet-5-5" }
adversary = { provider = "claude", model = "claude-sonnet-5-5" }
planner   = { provider = "claude", model = "claude-opus-5-5" }
verifier  = { provider = "claude", model = "claude-opus-5-5" }

[skills]
paths = [".agents/skills"]

[agents.claude]
path = "~/.claude"
args = ["--dangerously-skip-permissions", "--verbose"]

[agents.codex]
path = "~/.codex"

[adapters.backlog]
skill = "todo"

# Backlog is this repo's GitHub issues (defaults/adapters/github; needs gh signed in).
[adapters.backlog.scripts]
sync = "defaults/adapters/github/backlog-sync"
add = "defaults/adapters/github/backlog-add"
done = "defaults/adapters/github/backlog-done"
edit = "defaults/adapters/github/backlog-edit"
stop = "defaults/adapters/github/backlog-stop"

[landing]
mode = "pr"
# The backlog is this repo's GitHub issues, so merging an order's PR closes its issue.
close_issues = true

[runtime]
# "process" | "sprites"
default = "process"

[runtime.sprites]
# token_env = "SPRITES_TOKEN"
# base_url = ""
sprite_name = "noodle-dev"
# git_token_env = "GITHUB_TOKEN"

# [runtime.cursor]
